<dialog
  #dialog
  closedby="none"
  class="bg-[#1a2534] border border-white/10 rounded-lg px-5 py-4 text-white backdrop:backdrop-blur-sm"
>
  <div class="flex flex-col">
    <h2 class="text-lg">{{ title() }}</h2>
    <p class="text-gray-400">{{ subtitle() }}</p>

    <div class="flex self-end gap-2 mt-2 select-none">
      <button lib-button type="button" variant="gray" (click)="onCancel()">
        Cancelar
      </button>

      @if (variant() == 'remove') {
        <button lib-button type="button" variant="red" (click)="onConfirm()">
          Remover
        </button>
      }
    </div>
  </div>
</dialog>
