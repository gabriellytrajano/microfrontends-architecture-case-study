<lib-breadcrumb-component [label]="['Papéis', 'Novo Papel']" />

<div class="flex items-start justify-between">
  <div>
    <h2 class="text-xl font-medium">Adicionar Novo Papel</h2>
    <h3 class="text-sm text-neutral-400">Gerencie papéis aos usuários</h3>
  </div>
</div>

<app-role-info-form #form [editar]="false" (saved)="onSave(form, $event)" />

<app-role-toast #toastOk>
  <p class="text-sm font-medium">Novo Papel Adicionado!</p>
  <p class="text-sm">O novo papel já está disponível na lista.</p>
</app-role-toast>

<app-role-toast #toastErr variant="error">
  <p class="text-sm font-medium">Erro</p>
  <p class="text-sm">Houve um erro</p>
</app-role-toast>
